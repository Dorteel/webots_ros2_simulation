controller_manager:
  ros__parameters:
    update_rate: 50

    diffdrive_controller:
      type: diff_drive_controller/DiffDriveController

    arm_position_controller:
      type: forward_command_controller/ForwardCommandController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_position_controller:
  ros__parameters:
    joints:
      - arm_right_1_joint
      - arm_right_2_joint
      - arm_right_3_joint
      - arm_right_4_joint
      - arm_right_5_joint
      - arm_right_6_joint
      - arm_right_7_joint
      - arm_left_1_joint
      - arm_left_2_joint
      - arm_left_3_joint
      - arm_left_4_joint
      - arm_left_5_joint
      - arm_left_6_joint
      - arm_left_7_joint
    interface_name: position

diffdrive_controller:
  ros__parameters:
    left_wheel_names: ["wheel_left_joint"]
    right_wheel_names: ["wheel_right_joint"]

    wheel_separation: 0.404
    wheel_radius: 0.0985

    # The real separation between wheels is not resulting in a perfect odometry
    wheel_separation_multiplier: 1.089

    use_stamped_vel: false
    base_frame_id: "base_link"

joint_state_broadcaster:
  ros__parameters:
    extra_joints:
      - CASTER_WHEEL_FRONT_LEFT_JOINT
      - CASTER_WHEEL_FRONT_RIGHT_JOINT
      - CASTER_WHEEL_BACK_LEFT_JOINT
      - CASTER_WHEEL_BACK_RIGHT_JOINT
      - SMALL_WHEEL_JOINT
      - SMALL_WHEEL_JOINT_0
      - SMALL_WHEEL_JOINT_1
      - SMALL_WHEEL_JOINT_2
      - head_1_joint
      - head_2_joint
      - torso_lift_joint

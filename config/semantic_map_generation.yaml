# Matches the map -> odom transform at TIAGo's initial pose.
# Webots (-2.69, -2.49, 0) -> map (-2.63, -2.26, 0).
webots_to_map:
  translation_x: 0.06
  translation_y: 0.23
  yaw_offset: 0.0

anchor_types: [Cabinet, Sink, BathroomSink, Table, RoundTable, Desk, Oven, Door, Worktop]
anchor_name_prefixes: [fridge, counter]
approach_radii: [0.5, 0.65, 0.8]
candidate_count: 16
robot_clearance: 0.25  # metres around the candidate center; unknown cells are unsafe

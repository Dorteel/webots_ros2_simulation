#VRML_SIM R2023b utf8

PROTO EggCarton [
  field SFString   connectorModel "fallback disabled"
  field SFVec3f    translation 0 0 0
  field SFRotation rotation    0 0 1 0
  field SFString   name        "egg_carton"
]
{
  Solid {
    translation IS translation
    rotation IS rotation
    name IS name
    model "egg carton"

    children [
      DEF FALLBACK_OBJECT_CONNECTOR Connector {
        name "fallback object connector"
        model IS connectorModel
        type "passive"
        distanceTolerance 100
        axisTolerance 3.14159
        rotationTolerance 3.14159
        numberOfRotations 0
        snap TRUE
      }
      CadShape {
        url [
          "egg_carton.obj"
        ]
      }
    ]

    # Base-only collision keeps tabletop placement and grasping predictable.
    boundingObject Transform {
      translation 0 0 0.038
      children [
        Box {
          size 0.18 0.11 0.076
        }
      ]
    }

    physics Physics {
      mass 0.50
      centerOfMass [
        0 0 0.032
      ]
    }
  }
}
